services:
  # -------------------------------------------------------------
  # 1. FastAPI Web Service
  # -------------------------------------------------------------
  - type: web
    name: socialpilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "https://socialpilot-frontend-indol.vercel.app,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://socialpilot-frontend-indol.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: socialpilot-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: socialpilot_mongo
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false

  # -------------------------------------------------------------
  # 2. Celery Background Worker
  # -------------------------------------------------------------
  - type: worker
    name: socialpilot-celery-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q default,publishing
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: socialpilot-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: socialpilot-backend
          envVarKey: SECRET_KEY
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: socialpilot_mongo

databases:
  # -------------------------------------------------------------
  # Production Managed PostgreSQL
  # -------------------------------------------------------------
  - name: socialpilot-postgres
    databaseName: socialpilot_db
    user: socialpilot_user
    plan: free
