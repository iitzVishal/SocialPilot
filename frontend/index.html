<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/socialpilot-logo.jpg" />
    <link rel="apple-touch-icon" href="/socialpilot-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialPilot — Social Media Scheduler &amp; Campaign Platform</title>
    <meta name="description" content="Centralized multi-platform social media scheduling and campaign management dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!--
      Theme flash prevention.
      Runs BEFORE React hydrates to avoid flash.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('socialpilot_theme');
          var isDark = saved === 'dark' || (!saved) || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
